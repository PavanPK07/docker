networks:
  default:
    external:
      name: roboshop

services:
  mongodb:
    image: mongodb:1
    container_name: mongodb
    
  catalogue:
    image: catalogue:1
    container_name: catalogue
    depends_on:
      - mongodb
    
  web:
    image: web:1
    container_name: web
    depends_on:
      - catalogue
    ports:
      - "80:80"

  redis: 


  cart:
   image: cart:1
   container_name: cart
   depends_on:
   - redis
   - catalogue

  mysql:
    image: mysql:1
    container_name: mysql
     
  shipping: 
    image: shipping:1
    container_name: shipping
    depends_on:
      - mysql

  rabbitmq:
    image: rabbitmq:1
    container_name: rabbitmq
    environment:
    - RABBITMQ_DEFAULT_USER=roboshop
    - RABBITMQ_DEFAULT_PASS=roboshop123

  payment:
    container_name: payment
    image: payment:v1
    depends_on:
    - rabbitmq
    - user
    - cart
    